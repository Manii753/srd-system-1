<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Preview Test</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background: #f9fafb;
            padding: 16px;
            border-bottom: 1px solid #e5e7eb;
        }
        h1 {
            margin: 0;
            font-size: 20px;
            color: #1f2937;
        }
        .upload-area {
            padding: 40px;
            text-align: center;
            border: 2px dashed #d1d5db;
            margin: 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-area:hover {
            border-color: #10b981;
            background: #f0fdf4;
        }
        .upload-area.dragging {
            border-color: #10b981;
            background: #d1fae5;
        }
        #fileInput {
            display: none;
        }
        .tabs {
            display: flex;
            gap: 4px;
            padding: 8px;
            background: #f9fafb;
            border-bottom: 1px solid #e5e7eb;
            overflow-x: auto;
        }
        .tab {
            padding: 8px 16px;
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .tab:hover {
            background: #f3f4f6;
        }
        .tab.active {
            background: #10b981;
            color: white;
            border-color: #10b981;
        }
        .table-container {
            padding: 20px;
            overflow: auto;
            max-height: 600px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 13px;
        }
        td, th {
            border: 1px solid #d1d5db;
            padding: 8px 12px;
            text-align: left;
            min-width: 100px;
        }
        th {
            background-color: #f3f4f6;
            font-weight: 600;
            color: #374151;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        tr:nth-child(even) {
            background-color: #f9fafb;
        }
        tr:hover {
            background-color: #f0fdf4;
        }
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }
        .spinner {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #10b981;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .success {
            color: #10b981;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Excel Preview Test - SheetJS Implementation</h1>
            <p style="margin: 8px 0 0; color: #6b7280; font-size: 14px;">
                Upload an Excel file (.xlsx, .xls, .csv) to test the preview functionality
            </p>
        </div>

        <div id="uploadArea" class="upload-area">
            <div style="font-size: 48px; margin-bottom: 16px;">📤</div>
            <div style="font-size: 16px; font-weight: 500; margin-bottom: 8px;">
                Click to upload or drag and drop
            </div>
            <div style="font-size: 14px; color: #6b7280;">
                Excel files (.xlsx, .xls, .csv, .ods)
            </div>
            <input type="file" id="fileInput" accept=".xlsx,.xls,.csv,.ods">
        </div>

        <div id="tabs" class="tabs" style="display: none;"></div>
        <div id="content" class="table-container"></div>
    </div>

    <script>
        let workbook = null;
        let currentSheet = 0;

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const tabsContainer = document.getElementById('tabs');
        const content = document.getElementById('content');

        // Click to upload
        uploadArea.addEventListener('click', () => fileInput.click());

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragging');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragging');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragging');
            const file = e.dataTransfer.files[0];
            if (file) loadFile(file);
        });

        // File input change
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) loadFile(file);
        });

        async function loadFile(file) {
            // Show loading
            uploadArea.style.display = 'none';
            content.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <div>Loading ${file.name}...</div>
                </div>
            `;

            try {
                const arrayBuffer = await file.arrayBuffer();
                workbook = XLSX.read(arrayBuffer, {
                    type: 'array',
                    cellStyles: true,
                    cellDates: true,
                });

                if (workbook.SheetNames.length === 0) {
                    throw new Error('No sheets found in file');
                }

                renderTabs();
                renderSheet(0);

                content.innerHTML += `<div class="success">✅ Successfully loaded ${file.name}</div>`;
                setTimeout(() => {
                    const success = content.querySelector('.success');
                    if (success) success.remove();
                }, 3000);

            } catch (error) {
                content.innerHTML = `
                    <div class="loading">
                        <div style="color: #ef4444; font-size: 48px; margin-bottom: 16px;">⚠️</div>
                        <div style="color: #ef4444; font-weight: 600;">Failed to load file</div>
                        <div style="margin-top: 8px;">${error.message}</div>
                        <button onclick="location.reload()" style="
                            margin-top: 20px;
                            padding: 8px 16px;
                            background: #10b981;
                            color: white;
                            border: none;
                            border-radius: 4px;
                            cursor: pointer;
                            font-size: 14px;
                        ">Try Again</button>
                    </div>
                `;
            }
        }

        function renderTabs() {
            if (workbook.SheetNames.length <= 1) {
                tabsContainer.style.display = 'none';
                return;
            }

            tabsContainer.style.display = 'flex';
            tabsContainer.innerHTML = workbook.SheetNames.map((name, index) => `
                <button class="tab ${index === currentSheet ? 'active' : ''}" onclick="renderSheet(${index})">
                    ${name}
                </button>
            `).join('');
        }

        function renderSheet(index) {
            currentSheet = index;
            const sheetName = workbook.SheetNames[index];
            const worksheet = workbook.Sheets[sheetName];
            
            // Convert to HTML
            const html = XLSX.utils.sheet_to_html(worksheet, {
                id: 'excel-table',
                editable: false,
            });

            content.innerHTML = html;

            // Update active tab
            if (workbook.SheetNames.length > 1) {
                document.querySelectorAll('.tab').forEach((tab, i) => {
                    tab.classList.toggle('active', i === index);
                });
            }
        }
    </script>
</body>
</html>
